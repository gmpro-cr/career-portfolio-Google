name: CI Harness (Build + Typecheck + Verify)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install (with legacy peer deps)
        run: npm install --legacy-peer-deps

      - name: Full harness verify (emoji-guard + typecheck + build)
        run: npm run verify

      - name: Upload build artifact (for preview inspection if needed)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 7

      # Optional future: add bundle size check, lighthouse, or Playwright smoke
      # - name: Bundle size guard (example)
      #   run: |
      #     SIZE=$(du -sh dist | cut -f1)
      #     echo "Build size: $SIZE"
